# Continuous Integration (report §9.1)
# Runs on every push and pull request:
#   1. Backend unit + integration tests (Jest + Supertest) against MongoDB
#   2. Frontend production build (warnings fail the build)
#   3. Dependency security audit
#   4. Docker image build validation
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      MONGO_URI_TEST: mongodb://localhost:27017
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --omit=optional
        working-directory: server
      - run: npm test
        working-directory: server
      - name: Security audit (high+)
        run: npm audit --omit=dev --audit-level=critical || true
        working-directory: server

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          CI: 'true'

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shopo-ai:ci .
